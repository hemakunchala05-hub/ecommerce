version: '3.8'

services:
  # MongoDB Databases (Isolated data volumes for each service)
  user-db:
    image: mongo:latest
    container_name: ecommerce-user-db
    restart: always
    ports:
      - "27018:27017"
    volumes:
      - user_data:/data/db

  product-db:
    image: mongo:latest
    container_name: ecommerce-product-db
    restart: always
    ports:
      - "27019:27017"
    volumes:
      - product_data:/data/db

  cart-db:
    image: mongo:latest
    container_name: ecommerce-cart-db
    restart: always
    ports:
      - "27020:27017"
    volumes:
      - cart_data:/data/db

  order-db:
    image: mongo:latest
    container_name: ecommerce-order-db
    restart: always
    ports:
      - "27021:27017"
    volumes:
      - order_data:/data/db

  payment-db:
    image: mongo:latest
    container_name: ecommerce-payment-db
    restart: always
    ports:
      - "27022:27017"
    volumes:
      - payment_data:/data/db

  # Microservices
  user-service:
    build:
      context: ./services/user-service
      dockerfile: Dockerfile
    container_name: ecommerce-user-service
    restart: always
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
      - MONGO_URI=mongodb://user-db:27017/ecommerce_user_db
      - JWT_SECRET=super_secret_jwt_key_here
    depends_on:
      - user-db

  product-service:
    build:
      context: ./services/product-service
      dockerfile: Dockerfile
    container_name: ecommerce-product-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      - PORT=5002
      - MONGO_URI=mongodb://product-db:27017/ecommerce_product_db
    depends_on:
      - product-db

  cart-service:
    build:
      context: ./services/cart-service
      dockerfile: Dockerfile
    container_name: ecommerce-cart-service
    restart: always
    ports:
      - "5003:5003"
    environment:
      - PORT=5003
      - MONGO_URI=mongodb://cart-db:27017/ecommerce_cart_db
      - PRODUCT_SERVICE_URL=http://product-service:5002
    depends_on:
      - cart-db

  order-service:
    build:
      context: ./services/order-service
      dockerfile: Dockerfile
    container_name: ecommerce-order-service
    restart: always
    ports:
      - "5004:5004"
    environment:
      - PORT=5004
      - MONGO_URI=mongodb://order-db:27017/ecommerce_order_db
      - CART_SERVICE_URL=http://cart-service:5003
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - PAYMENT_SERVICE_URL=http://payment-service:5005
    depends_on:
      - order-db

  payment-service:
    build:
      context: ./services/payment-service
      dockerfile: Dockerfile
    container_name: ecommerce-payment-service
    restart: always
    ports:
      - "5005:5005"
    environment:
      - PORT=5005
      - MONGO_URI=mongodb://payment-db:27017/ecommerce_payment_db
    depends_on:
      - payment-db

  notification-service:
    build:
      context: ./services/notification-service
      dockerfile: Dockerfile
    container_name: ecommerce-notification-service
    restart: always
    ports:
      - "5006:5006"
    environment:
      - PORT=5006

  # API Gateway
  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: ecommerce-api-gateway
    restart: always
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - USER_SERVICE_URL=http://user-service:5001
      - PRODUCT_SERVICE_URL=http://product-service:5002
      - CART_SERVICE_URL=http://cart-service:5003
      - ORDER_SERVICE_URL=http://order-service:5004
      - PAYMENT_SERVICE_URL=http://payment-service:5005
      - NOTIFICATION_SERVICE_URL=http://notification-service:5006
    depends_on:
      - user-service
      - product-service
      - cart-service
      - order-service
      - payment-service
      - notification-service

volumes:
  user_data:
  product_data:
  cart_data:
  order_data:
  payment_data:
